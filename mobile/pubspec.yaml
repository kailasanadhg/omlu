name: omlu
description: "OMLU — Our Memories Link Us. A photography-first shared memory platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.4.0
  
  # Image loading & caching
  cached_network_image: ^3.4.1
  
  # State management
  provider: ^6.1.4
  
  # Secure storage for JWT tokens
  flutter_secure_storage: ^9.2.4
  
  # Camera
  camera: ^0.11.1
  
  # Image processing
  image: ^4.5.3
  
  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # UUID generation for client IDs
  uuid: ^4.5.1
  
  # URL launcher (for external links)
  url_launcher: ^6.3.1
  
  # Masonry grid layout
  flutter_staggered_grid_view: ^0.7.0
  
  # Photo viewer with zoom
  photo_view: ^0.15.0
  
  # QR code generation
  qr_flutter: ^4.1.0
  
  # QR code scanning
  mobile_scanner: ^6.0.5
  
  # Date formatting
  intl: ^0.20.2
  
  # Shimmer loading effects
  shimmer: ^3.0.0
  
  # Pull to refresh
  pull_to_refresh_flutter3: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
